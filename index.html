<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Senn AI</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070812;
      --panel: rgba(16, 18, 32, 0.78);
      --panel-2: rgba(25, 28, 48, 0.72);
      --border: rgba(255,255,255,0.08);
      --text: #f4f6ff;
      --muted: #8e94ab;
      --accent: #7c5cff;
      --accent-2: #3d8bff;
      --danger: #ff5577;
      --user: #7357ff;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(124,92,255,0.18),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(61,139,255,0.12),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /*
    |--------------------------------------------------------------------------
    | APP
    |--------------------------------------------------------------------------
    */

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /*
    |--------------------------------------------------------------------------
    | SIDEBAR
    |--------------------------------------------------------------------------
    */

    .sidebar {
      width: 270px;
      height: 100vh;

      padding: 18px;

      border-right:
        1px solid var(--border);

      background:
        rgba(7,8,18,0.82);

      backdrop-filter:
        blur(22px);

      display: flex;
      flex-direction: column;

      transition:
        width .25s ease,
        transform .25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;

      margin-bottom: 24px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;

      border-radius: 13px;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-2)
        );

      font-weight: 800;
      font-size: 18px;

      box-shadow:
        0 0 30px
        rgba(124,92,255,0.28);
    }

    .brand-name {
      font-size: 17px;
      font-weight: 700;
    }

    .brand-version {
      margin-top: 2px;

      color: var(--muted);

      font-size: 11px;
    }

    .new-chat {
      width: 100%;

      padding: 12px 14px;

      border-radius: 12px;

      background:
        var(--panel-2);

      border:
        1px solid var(--border);

      color: var(--text);

      text-align: left;

      transition: .2s;
    }

    .new-chat:hover {
      background:
        rgba(124,92,255,0.15);

      border-color:
        rgba(124,92,255,0.35);
    }

    .sidebar-label {
      margin:
        24px 8px 10px;

      color:
        var(--muted);

      font-size:
        11px;

      text-transform:
        uppercase;

      letter-spacing:
        1px;
    }

    .chat-history {
      display: flex;
      flex-direction: column;
      gap: 5px;

      overflow-y: auto;
    }

    .history-item {
      padding: 10px 12px;

      border-radius: 10px;

      color:
        #b8bdd0;

      font-size:
        13px;

      white-space:
        nowrap;

      overflow:
        hidden;

      text-overflow:
        ellipsis;

      cursor:
        pointer;

      transition:
        .2s;
    }

    .history-item:hover {
      background:
        rgba(255,255,255,0.05);

      color:
        white;
    }

    .sidebar-bottom {
      margin-top:
        auto;

      padding-top:
        15px;

      border-top:
        1px solid var(--border);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;

      color:
        var(--muted);

      font-size:
        12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        #4ade80;

      box-shadow:
        0 0 10px
        rgba(74,222,128,.7);
    }

    /*
    |--------------------------------------------------------------------------
    | MAIN
    |--------------------------------------------------------------------------
    */

    .main {
      flex: 1;

      min-width: 0;

      display: flex;
      flex-direction: column;

      position: relative;
    }

    /*
    |--------------------------------------------------------------------------
    | TOPBAR
    |--------------------------------------------------------------------------
    */

    .topbar {
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        0 22px;

      border-bottom:
        1px solid var(--border);

      background:
        rgba(7,8,18,0.45);

      backdrop-filter:
        blur(18px);
    }

    .mobile-menu {
      display: none;

      width: 38px;
      height: 38px;

      border-radius: 10px;

      color: white;

      background:
        rgba(255,255,255,0.05);
    }

    .top-title {
      font-size:
        14px;

      font-weight:
        600;
    }

    .top-subtitle {
      margin-top:
        2px;

      font-size:
        11px;

      color:
        var(--muted);
    }

    .model-badge {
      padding:
        7px 11px;

      border-radius:
        999px;

      background:
        rgba(124,92,255,0.10);

      border:
        1px solid
        rgba(124,92,255,0.22);

      color:
        #bdb1ff;

      font-size:
        11px;
    }

    /*
    |--------------------------------------------------------------------------
    | CHAT AREA
    |--------------------------------------------------------------------------
    */

    .chat {
      flex: 1;

      overflow-y:
        auto;

      padding:
        30px 20px 150px;
    }

    .chat-inner {
      width: 100%;
      max-width: 850px;

      margin:
        0 auto;
    }

    /*
    |--------------------------------------------------------------------------
    | WELCOME
    |--------------------------------------------------------------------------
    */

    .welcome {
      min-height:
        calc(100vh - 260px);

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

      text-align:
        center;

      padding:
        30px;
    }

    .welcome-icon {
      width:
        72px;

      height:
        72px;

      display:
        grid;

      place-items:
        center;

      border-radius:
        23px;

      margin-bottom:
        20px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-2)
        );

      font-size:
        28px;

      font-weight:
        800;

      box-shadow:
        0 0 55px
        rgba(124,92,255,.25);
    }

    .welcome h1 {
      font-size:
        clamp(28px, 5vw, 46px);

      line-height:
        1.1;

      letter-spacing:
        -1.5px;
    }

    .welcome h1 span {
      background:
        linear-gradient(
          90deg,
          #ffffff,
          #9f91ff,
          #65a4ff
        );

      -webkit-background-clip:
        text;

      background-clip:
        text;

      color:
        transparent;
    }

    .welcome p {
      max-width:
        570px;

      margin-top:
        14px;

      color:
        var(--muted);

      font-size:
        14px;

      line-height:
        1.7;
    }

    .suggestions {
      display:
        flex;

      flex-wrap:
        wrap;

      justify-content:
        center;

      gap:
        8px;

      margin-top:
        26px;
    }

    .suggestion {
      padding:
        10px 13px;

      border-radius:
        10px;

      color:
        #c9ccda;

      background:
        rgba(255,255,255,0.04);

      border:
        1px solid
        var(--border);

      font-size:
        12px;

      transition:
        .2s;
    }

    .suggestion:hover {
      background:
        rgba(124,92,255,0.12);

      border-color:
        rgba(124,92,255,.3);

      transform:
        translateY(-1px);
    }

    /*
    |--------------------------------------------------------------------------
    | MESSAGES
    |--------------------------------------------------------------------------
    */

    .message {
      display:
        flex;

      gap:
        12px;

      margin-bottom:
        24px;

      animation:
        messageIn .2s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform:
          translateY(7px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }
    }

    .message.user {
      flex-direction:
        row-reverse;
    }

    .avatar {
      flex:
        0 0 auto;

      width:
        34px;

      height:
        34px;

      display:
        grid;

      place-items:
        center;

      border-radius:
        11px;

      font-size:
        12px;

      font-weight:
        700;

      background:
        rgba(255,255,255,0.06);

      border:
        1px solid
        var(--border);
    }

    .message.user .avatar {
      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-2)
        );

      border:
        0;
    }

    .bubble {
      max-width:
        min(720px, 78%);

      padding:
        12px 15px;

      border-radius:
        15px;

      background:
        rgba(255,255,255,0.045);

      border:
        1px solid
        var(--border);

      color:
        #e9ebf4;

      font-size:
        14px;

      line-height:
        1.7;

      white-space:
        pre-wrap;

      word-break:
        break-word;
    }

    .message.user .bubble {
      background:
        linear-gradient(
          135deg,
          rgba(124,92,255,.88),
          rgba(61,139,255,.75)
        );

      border:
        0;

      color:
        white;
    }

    /*
    |--------------------------------------------------------------------------
    | TYPING
    |--------------------------------------------------------------------------
    */

    .typing {
      display:
        flex;

      align-items:
        center;

      gap:
        4px;

      padding:
        7px 2px;
    }

    .typing span {
      width:
        6px;

      height:
        6px;

      border-radius:
        50%;

      background:
        #9a9fb4;

      animation:
        typing 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay:
        .15s;
    }

    .typing span:nth-child(3) {
      animation-delay:
        .3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: .3;
        transform:
          translateY(0);
      }

      30% {
        opacity: 1;
        transform:
          translateY(-3px);
      }
    }

    /*
    |--------------------------------------------------------------------------
    | COMPOSER
    |--------------------------------------------------------------------------
    */

    .composer-wrap {
      position:
        absolute;

      left:
        0;

      right:
        0;

      bottom:
        0;

      padding:
        20px;

      background:
        linear-gradient(
          transparent,
          var(--bg) 35%
        );
    }

    .composer {
      width:
        100%;

      max-width:
        850px;

      margin:
        0 auto;

      display:
        flex;

      align-items:
        flex-end;

      gap:
        10px;

      padding:
        10px;

      border-radius:
        17px;

      background:
        rgba(18,20,35,.92);

      border:
        1px solid
        rgba(255,255,255,.09);

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.25);

      backdrop-filter:
        blur(20px);
    }

    .composer textarea {
      flex:
        1;

      min-height:
        42px;

      max-height:
        150px;

      resize:
        none;

      border:
        0;

      outline:
        0;

      background:
        transparent;

      color:
        white;

      padding:
        11px 8px;

      font-size:
        14px;

      line-height:
        1.5;
    }

    .composer textarea::placeholder {
      color:
        #686d82;
    }

    .send {
      width:
        42px;

      height:
        42px;

      flex:
        0 0 auto;

      border-radius:
        12px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-2)
        );

      color:
        white;

      font-size:
        17px;

      transition:
        .2s;
    }

    .send:hover {
      transform:
        translateY(-1px);

      box-shadow:
        0 7px 22px
        rgba(124,92,255,.3);
    }

    .send:disabled {
      opacity:
        .45;

      cursor:
        not-allowed;

      transform:
        none;

      box-shadow:
        none;
    }

    .composer-note {
      max-width:
        850px;

      margin:
        8px auto 0;

      text-align:
        center;

      color:
        #555a70;

      font-size:
        10px;
    }

    /*
    |--------------------------------------------------------------------------
    | MOBILE
    |--------------------------------------------------------------------------
    */

    @media (max-width: 760px) {

      .sidebar {
        position:
          fixed;

        z-index:
          100;

        left:
          0;

        top:
          0;

        transform:
          translateX(-100%);
      }

      .sidebar.open {
        transform:
          translateX(0);
      }

      .mobile-menu {
        display:
          block;
      }

      .topbar {
        gap:
          10px;
      }

      .chat {
        padding:
          22px 12px 140px;
      }

      .composer-wrap {
        padding:
          12px;
      }

      .bubble {
        max-width:
          84%;
      }

      .welcome {
        padding:
          20px 10px;
      }

      .welcome p {
        font-size:
          13px;
      }

    }

  </style>
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="brand">

        <div class="brand-logo">
          S
        </div>

        <div>

          <div class="brand-name">
            Senn AI
          </div>

          <div class="brand-version">
            Version 2.0
          </div>

        </div>

      </div>


      <button

    <!-- MAIN -->

    <main class="main">

        </div>

      </header>


      <!-- CHAT -->

      <section

      >

        >

          <div

              >
                Jelasin AI
              </button>

              <button
                class="suggestion"
                data-message="Bantu gw bikin website"
              >
                Bantu coding
              </button>

              <button
                class="suggestion"
                data-message="Cari informasi teknologi terbaru"
              >
                Cari informasi
              </button>

              <button
                class="suggestion"
                data-message="Hitung 125 * 24"
              >
                Hitung sesuatu
              </button>

            </div>

          </div>

        </div>

      </section>


      <!-- COMPOSER -->

      <div class="composer-wrap">

        <form
          class="composer"
          id="composer"
        >

          <textarea
            id="messageInput"
            rows="1"
            placeholder="Message Senn AI..."

          ></textarea>


          <button
            class="send"
            id="sendButton"

          >
            ↑
          </button>

        </form>


        <div class="composer-note">
          Senn AI can make mistakes. Verify important information.
        </div>

      </div>

    </main>

  </div>

    const sendButton =
      document.getElementById(

    const composer =

    const chatHistory =

      );

      );
